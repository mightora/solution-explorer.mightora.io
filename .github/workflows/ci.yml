name: CI · test and offline build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve official Mightora logo for offline edition
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error --retry 3 --max-time 20 \
            https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/mightoraIoLogo4-200x900.png \
            --output assets/mightora-logo.png
          test -s assets/mightora-logo.png
      - name: Retrieve author artwork for offline edition (optional)
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 25 \
            https://techtweedie.github.io/images/author/ian-tweedie-sq2_hu_a380911c6f4726de.png \
            --output assets/author-avatar.png || rm -f assets/author-avatar.png
          curl --fail --location --silent --show-error --retry 2 --max-time 25 \
            https://raw.githubusercontent.com/TechTweedie/techtweedie.github.io/v2/assets/images/site/main-logo.png \
            --output assets/author-blog-logo.png || rm -f assets/author-blog-logo.png
          curl --fail --location --silent --show-error --retry 2 --max-time 25 \
            https://cdn.jsdelivr.net/gh/mightora/shared-ui@main/ian-tweedie-presenting-4.png \
            --output assets/author-background.png || rm -f assets/author-background.png
      - name: Retrieve footer brand artwork (optional)
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 20 \
            https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/TechTweedie_bw.png \
            --output assets/footer-techtweedie.png || rm -f assets/footer-techtweedie.png
          curl --fail --location --silent --show-error --retry 2 --max-time 20 \
            https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/tweedTechnologyLogoLight.png \
            --output assets/footer-tweed.png || rm -f assets/footer-tweed.png
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: solution-explorer-website-and-offline
          path: dist/
